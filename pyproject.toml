[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keepsafe-cli"
version = "0.1.0.dev0"
description = "Unaudited local encrypted secrets vault: one passphrase-protected file (Argon2id + XChaCha20-Poly1305 via libsodium). For personal use and learning."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Keepsafe CLI contributors" }]
keywords = ["password-manager", "vault", "secrets", "cli", "encryption"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "pynacl>=1.5",
    "argon2-cffi>=23",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
keepsafe = "keepsafe.cli:main"

[project.urls]
Homepage = "https://github.com/TheFadGhost/keepsafe-cli"

[tool.setuptools]
packages = ["keepsafe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
